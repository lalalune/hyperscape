name: Deploy Assets to Cloudflare R2

# NOTE: Frontend deployment is handled by deploy-pages.yml.
# This workflow only handles R2 asset uploads (manifests, WASM, models, etc.)
# Only runs on pushes to main branch (NOT on PRs or staging branch)
#
# Frontend URLs:
#   - Production: hyperia.club (main branch)
#   - Staging: staging.hyperia.club (staging branch)
#
# API URLs (Railway):
#   - Production: api.hyperia.club
#   - Staging: staging-api.hyperia.club

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/world/assets/manifests/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_ref:
        description: 'Git ref (commit SHA or tag) to deploy/rollback'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 50ad2052bbc6ca528d6993a689b419a4
  # Production uses hyperia-assets bucket
  # Staging uses hyperia-assets-staging bucket (create this in Cloudflare R2)
  R2_BUCKET_PRODUCTION: hyperia-assets
  R2_BUCKET_STAGING: hyperia-assets-staging

jobs:
  deploy-assets:
    name: Deploy Assets to R2 (${{ (github.ref_name == 'staging' || inputs.environment == 'staging') && 'staging' || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'staging' || inputs.environment == 'staging') && 'staging' || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ inputs.deploy_ref || github.sha }}

      - name: Determine deployment target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "staging" ] || [ "${{ inputs.environment }}" = "staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "bucket=${{ env.R2_BUCKET_STAGING }}" >> $GITHUB_OUTPUT
            echo "🎭 Deploying to STAGING (staging-assets.hyperia.club)"
          else
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "bucket=${{ env.R2_BUCKET_PRODUCTION }}" >> $GITHUB_OUTPUT
            echo "🚀 Deploying to PRODUCTION (assets.hyperia.club)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Fetch assets
        run: node scripts/ensure-assets.mjs
      - name: Upload manifests to R2
        run: |
          MANIFESTS_DIR="packages/server/world/assets/manifests"
          BUCKET="${{ steps.target.outputs.bucket }}"
          
          if [ ! -d "$MANIFESTS_DIR" ]; then
            echo "⚠️ Manifests directory not found, skipping"
            exit 0
          fi
          
          echo "📦 Uploading manifests to R2 bucket: $BUCKET"
          
          # Upload all JSON files recursively
          find "$MANIFESTS_DIR" -type f -name "*.json" | while read file; do
            rel_path="${file#$MANIFESTS_DIR/}"
            key="manifests/$rel_path"
            echo "  → $key"
            wrangler r2 object put "$BUCKET/$key" --remote \
              --file="$file" \
              --content-type="application/json" \
              --cache-control="max-age=0, no-cache, no-store, must-revalidate"
          done
          
          echo "✅ Manifests uploaded to R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload WASM and web assets to R2
        run: |
          ASSETS_DIR="assets"
          BUCKET="${{ steps.target.outputs.bucket }}"
          
          if [ ! -d "$ASSETS_DIR" ]; then
            echo "⚠️ Assets directory not found, skipping"
            exit 0
          fi
          
          echo "📦 Uploading assets to R2 bucket: $BUCKET"
          
          find "$ASSETS_DIR" -type f | grep -v "$ASSETS_DIR/manifests/" | while read file; do
            rel_path="${file#$ASSETS_DIR/}"
            key="$rel_path"
            
            # Determine content type
            case "$file" in
              *.wasm) content_type="application/wasm" ;;
              *.js) content_type="application/javascript" ;;
              *.json) content_type="application/json" ;;
              *.glb) content_type="model/gltf-binary" ;;
              *.gltf) content_type="model/gltf+json" ;;
              *.vrm) content_type="model/gltf-binary" ;;
              *.png) content_type="image/png" ;;
              *.jpg|*.jpeg) content_type="image/jpeg" ;;
              *.webp) content_type="image/webp" ;;
              *.mp3) content_type="audio/mpeg" ;;
              *.ogg) content_type="audio/ogg" ;;
              *) content_type="application/octet-stream" ;;
            esac
            
            echo "  → $key ($content_type)"
            wrangler r2 object put "$BUCKET/$key" --remote \
              --file="$file" \
              --content-type="$content_type"
          done
          
          echo "✅ Assets uploaded to R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

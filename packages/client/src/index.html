<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Hyperia</title>
  <meta name="description" content="Hyperia - A 3D MMORPG Virtual World" />

  <!-- Theme and PWA -->
  <meta name="theme-color" content="#0b0a15" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/images/app-icon-192.png" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hyperia" />
  <meta property="og:description" content="Hyperia - A 3D MMORPG Virtual World" />
  <meta property="og:image" content="/images/preview.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Hyperia" />
  <meta name="twitter:description" content="Hyperia - A 3D MMORPG Virtual World" />
  <meta name="twitter:image" content="/images/preview.jpg" />

  <!-- Viewport and Mobile -->
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Hyperia" />

  <!-- Preconnect to external resources for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload critical assets -->
  <link rel="preload" href="/fonts/rubik.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="prefetch" href="/images/app_background.png" as="image" />
  <link rel="prefetch" href="/images/hyperia-wordmark.svg" as="image" />

  <!-- DNS prefetch for API endpoints -->
  <link rel="dns-prefetch" href="https://hyperia.gg" />

  <!-- Critical inline styles to prevent FOUC -->
  <style>
    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0a15;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Skip links - hidden for now, will show when character is signed in */
    .skip-link {
      display: none;
    }
  </style>
</head>

<body>
  <!-- Skip Links for Accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <a href="#game-canvas" class="skip-link" style="left: 180px;">Skip to game</a>

  <div id="root"></div>
  <script>
    // Aggressively unregister stale service workers and clear caches before
    // loading any module scripts.  A previous production build (or `vite preview`)
    // may have installed a service worker whose CacheFirst JS strategy now serves
    // HTML for chunk requests, causing MIME-type errors on dynamic imports.
    (() => {
      const productionHosts = [
        'hyperia.club',
        'www.hyperia.club',
        'hyperia.gg',
        'www.hyperia.gg',
        'hyperia-production.up.railway.app',
      ];
      const isLoopbackHost = ['localhost', '127.0.0.1', '0.0.0.0', '::1'].includes(
        window.location.hostname,
      );
      const shouldResetProductionCaches =
        productionHosts.includes(window.location.hostname) &&
        !localStorage.getItem('__hyperia_prod_sw_reset_20260407__');
      if (!isLoopbackHost && !shouldResetProductionCaches) return;

      const storageKey = '__hyperia_prod_sw_reset_20260407__';
      const reloadMarker = '__hyperia_sw_reset__';

      void (async () => {
        let shouldReload = false;
        const logPrefix = shouldResetProductionCaches ? '[Bootstrap]' : '[Dev]';

        if ('serviceWorker' in navigator) {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            if (registrations.length > 0) {
              await Promise.all(registrations.map(r => r.unregister()));
              shouldReload = true;
              console.log(
                logPrefix + ' Unregistered ' + registrations.length + ' stale service worker(s).',
              );
            }
          } catch (e) {
            console.warn(logPrefix + ' Failed to unregister service workers:', e);
          }
        }

        if ('caches' in window) {
          try {
            const cacheKeys = await caches.keys();
            const staleKeys = cacheKeys.filter(
              k => k.startsWith('workbox') || k.startsWith('hyperia'),
            );
            if (staleKeys.length > 0) {
              await Promise.all(staleKeys.map(k => caches.delete(k)));
              shouldReload = true;
              console.log(
                logPrefix + ' Cleared ' + staleKeys.length + ' stale cache bucket(s).',
              );
            }
          } catch (e) {
            console.warn(logPrefix + ' Failed to clear caches:', e);
          }
        }

        // Reload once after cleanup so the next page load is free of stale SW interference.
        if (shouldResetProductionCaches) {
          localStorage.setItem(storageKey, '1');
        }
        if (shouldReload && !sessionStorage.getItem(reloadMarker)) {
          sessionStorage.setItem(reloadMarker, '1');
          window.location.reload();
          return;
        }
        sessionStorage.removeItem(reloadMarker);
      })();
    })();
  </script>
  <script src="/env.js"></script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
